[package]
name = "rocinante-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"

[dependencies]
rocinante-analysis = { path = "../rocinante-analysis" }
rocinante-core = { path = "../rocinante-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
sled = "0.34"
duckdb = { version = "1.1", features = ["bundled"], optional = true }
sha2 = "0.11"

[features]
default = ["analytics"]
analytics = ["dep:duckdb"]

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"
