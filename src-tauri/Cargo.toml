[package]
name = "rocinante-repo-analyzer"
version = "0.2.1"
edition = "2021"
rust-version = "1.96.1"

[lib]
name = "repo_analyzer_core"
path = "src/lib.rs"

[dependencies]
fs2 = "0.4"
rocinante-core = { path = "crates/rocinante-core" }
rocinante-analysis = { path = "crates/rocinante-analysis" }
rocinante-storage = { path = "crates/rocinante-storage", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
duckdb = { version = "=1.10506.0", default-features = false, optional = true }
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"

[features]
default = ["analytics"]
analytics = ["rocinante-storage/analytics", "dep:duckdb"]

[dev-dependencies]
tempfile = "3"

[workspace]
members = [
    "crates/rocinante-core",
    "crates/rocinante-analysis",
    "crates/rocinante-storage",
    "crates/rocinante-desktop-shell",
]
resolver = "2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
